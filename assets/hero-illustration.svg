<svg viewBox="0 0 560 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WiseRobot mascot waving, surrounded by email, calendar, tick and hours-saved icons">
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0f9488"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <style>
    .wave { transform-origin: 345px 318px; animation: wave 2.4s ease-in-out infinite; }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
    .bob { animation: bob 3.6s ease-in-out infinite; }
    .bob2 { animation: bob 4.4s ease-in-out infinite reverse; }
    .ball { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes wave { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-16deg); } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.25); } }
    @media (prefers-reduced-motion: reduce) { .wave,.blink,.bob,.bob2,.ball { animation: none; } }
  </style>

  <!-- soft backdrop -->
  <circle cx="280" cy="232" r="205" fill="#14b8a6" fill-opacity="0.12"/>
  <circle cx="280" cy="232" r="150" fill="#ffc44d" fill-opacity="0.16"/>

  <!-- floating icon cards -->
  <g class="bob">
    <g transform="translate(46,92)">
      <rect width="78" height="62" rx="16" fill="#fff" stroke="#bdeee7" stroke-width="2"/>
      <rect x="18" y="19" width="42" height="28" rx="6" fill="#e6f7f4" stroke="#0f9488" stroke-width="2.5"/>
      <path d="M20 23l19 14 19-14" fill="none" stroke="#0f9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <g class="bob2">
    <g transform="translate(436,70)">
      <rect width="78" height="70" rx="16" fill="#fff" stroke="#ffd9cc" stroke-width="2"/>
      <rect x="16" y="20" width="46" height="36" rx="7" fill="#fff1ea" stroke="#ff7a59" stroke-width="2.5"/>
      <rect x="16" y="20" width="46" height="10" rx="5" fill="#ff7a59"/>
      <circle cx="29" cy="42" r="3.5" fill="#ff7a59"/><circle cx="39" cy="42" r="3.5" fill="#ff7a59"/><circle cx="49" cy="42" r="3.5" fill="#ffc44d"/>
    </g>
  </g>
  <g class="bob">
    <g transform="translate(450,282)">
      <circle cx="34" cy="34" r="34" fill="#fff" stroke="#bdeee7" stroke-width="2"/>
      <circle cx="34" cy="34" r="22" fill="#0f9488"/>
      <path d="M24 35l7 7 13-15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <g class="bob2">
    <g transform="translate(36,290)">
      <rect width="96" height="58" rx="18" fill="#fff" stroke="#ffe7a8" stroke-width="2"/>
      <circle cx="26" cy="29" r="14" fill="#ffc44d"/>
      <path d="M26 21v9l6 4" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="36" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="800" font-size="20" fill="#134e4a">+5h</text>
    </g>
  </g>

  <!-- ground shadow -->
  <ellipse cx="280" cy="418" rx="95" ry="12" fill="#134e4a" fill-opacity="0.14"/>

  <!-- feet -->
  <ellipse cx="250" cy="404" rx="30" ry="14" fill="#0f766e"/>
  <ellipse cx="310" cy="404" rx="30" ry="14" fill="#0f766e"/>

  <!-- left arm (resting) -->
  <path d="M222 322 Q184 340 178 372" fill="none" stroke="#0f9488" stroke-width="24" stroke-linecap="round"/>
  <circle cx="178" cy="376" r="15" fill="#2dd4bf"/>

  <!-- body -->
  <rect x="212" y="292" width="136" height="112" rx="48" fill="url(#body)"/>
  <circle cx="280" cy="346" r="24" fill="#fff" fill-opacity="0.95"/>
  <path d="M269 346l8 8 14-16" fill="none" stroke="#ff7a59" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- waving right arm -->
  <g class="wave">
    <path d="M338 322 Q386 316 402 262" fill="none" stroke="#0f9488" stroke-width="24" stroke-linecap="round"/>
    <circle cx="404" cy="254" r="16" fill="#2dd4bf"/>
  </g>

  <!-- antenna -->
  <rect x="276" y="88" width="8" height="40" rx="4" fill="#0f766e"/>
  <circle class="ball" cx="280" cy="82" r="12" fill="#ff7a59"/>

  <!-- ears -->
  <circle cx="166" cy="206" r="19" fill="#0f766e"/>
  <circle cx="394" cy="206" r="19" fill="#0f766e"/>

  <!-- head -->
  <rect x="172" y="124" width="216" height="162" rx="76" fill="url(#head)"/>
  <!-- face screen -->
  <rect x="196" y="148" width="168" height="112" rx="52" fill="#134e4a"/>
  <!-- eyes -->
  <ellipse class="blink" cx="244" cy="196" rx="15" ry="20" fill="#9ff3e6"/>
  <ellipse class="blink" cx="316" cy="196" rx="15" ry="20" fill="#9ff3e6"/>
  <circle cx="249" cy="189" r="5" fill="#fff"/>
  <circle cx="321" cy="189" r="5" fill="#fff"/>
  <!-- smile and cheeks -->
  <path d="M258 230q22 18 44 0" fill="none" stroke="#9ff3e6" stroke-width="6" stroke-linecap="round"/>
  <circle cx="218" cy="228" r="9" fill="#ff7a59" fill-opacity="0.65"/>
  <circle cx="342" cy="228" r="9" fill="#ff7a59" fill-opacity="0.65"/>
  <!-- head shine -->
  <path d="M200 150q22-22 58-24" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="7" stroke-linecap="round"/>
</svg>
