<svg viewBox="110 84 340 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WiseRobot mascot giving a thumbs up">
  <style>
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
    .ball { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.25); } }
    @media (prefers-reduced-motion: reduce) { .blink,.ball { animation: none; } }
  </style>

  <!-- ground shadow -->
  <ellipse cx="280" cy="430" rx="84" ry="10" fill="#64748b" fill-opacity="0.18"/>

  <!-- stubby legs and feet -->
  <rect x="246" y="398" width="26" height="22" rx="10" fill="#475569"/>
  <rect x="288" y="398" width="26" height="22" rx="10" fill="#475569"/>
  <ellipse cx="256" cy="420" rx="23" ry="10" fill="#64748b"/>
  <ellipse cx="304" cy="420" rx="23" ry="10" fill="#64748b"/>

  <!-- neck and small pear-shaped body -->
  <rect x="262" y="322" width="36" height="22" rx="8" fill="#0ea5a4"/>
  <path d="M280 330 C318 330 336 352 334 380 C332 404 312 414 280 414 C248 414 228 404 226 380 C224 352 242 330 280 330 Z" fill="#0ea5a4"/>
  <!-- belly highlight -->
  <path d="M244 356 Q252 342 268 340" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="6" stroke-linecap="round"/>
  <!-- chest panel -->
  <rect x="252" y="354" width="56" height="38" rx="14" fill="#f1f5f9"/>
  <path d="M268 373l8 8 15-16" fill="none" stroke="#0ea5a4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- left arm (resting), in front of the body -->
  <path d="M234 350 Q212 360 206 382" fill="none" stroke="#0ea5a4" stroke-width="19" stroke-linecap="round"/>
  <!-- resting hand: cartoon mitten glove, thumb facing forward -->
  <g transform="translate(205 396) rotate(8) scale(1.2)" fill="#f8fafc" stroke="#b6c2d1" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-9 -15 C-18 -12 -19 6 -11 13 C-5 19 7 18 10 11 C12 6 11 1 10 -2 C17 -1 21 -7 16 -11 C13 -13 10 -12 8 -11 L8 -15 Z"/>
    <path d="M10 -2 C8 -5 8 -8 8 -11" fill="none"/>
  </g>

  <g transform="translate(280 332) scale(0.8) translate(-280 -332)">
  <!-- antenna: tapered stem + ball -->
  <path d="M271 96 L289 96 L285 62 L275 62 Z" fill="#0ea5a4"/>
  <circle class="ball" cx="280" cy="52" r="13" fill="#ff7a59"/>

  <!-- ears (slanted side pods, like the logo) -->
  <path d="M130 192 L116 197 Q103 201 102 216 L100 262 Q100 276 112 276 L130 268 Z" fill="#0ea5a4"/>
  <path d="M430 192 L444 197 Q457 201 458 216 L460 262 Q460 276 448 276 L430 268 Z" fill="#0ea5a4"/>

  <!-- raised top bump -->
  <path d="M232 128 Q232 100 262 98 L298 98 Q328 100 328 128 Z" fill="#0ea5a4"/>

  <!-- head: thick dark ring, wide and squat -->
  <path d="M130 230 C130 148 196 112 280 112 C364 112 430 148 430 230 C430 300 372 338 280 338 C188 338 130 300 130 230 Z" fill="#0ea5a4"/>
  <!-- light face -->
  <path d="M164 232 C164 178 212 146 280 146 C348 146 396 178 396 232 C396 276 350 304 280 304 C210 304 164 276 164 232 Z" fill="#f1f5f9"/>

  <!-- eyes: tall ovals -->
  <ellipse class="blink" cx="232" cy="226" rx="17" ry="25" fill="#0ea5a4"/>
  <ellipse class="blink" cx="328" cy="226" rx="17" ry="25" fill="#0ea5a4"/>
  <!-- smile -->
  <path d="M256 268 Q280 292 304 268" fill="none" stroke="#0ea5a4" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- right arm: thumbs up (drawn last so it stays in front) -->
  <g>
    <path d="M326 354 Q358 362 380 352" fill="none" stroke="#0ea5a4" stroke-width="19" stroke-linecap="round"/>
    <!-- thumbs-up hand: one glove silhouette, thumb up, fingers curled toward the viewer -->
    <g transform="translate(398 352) scale(1.15)" fill="#f8fafc" stroke="#b6c2d1" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-18 12 C-22 4 -22 -8 -14 -14 L-14 -31 C-14 -41 0 -41 0 -31 L0 -16 C8 -18 20 -16 21 -6 C23 6 18 17 6 18 C-4 19 -14 18 -18 12 Z"/>
      <path d="M-14 -15 Q-7 -12 0 -16" fill="none"/>
      <path d="M5 -5 Q13 -3 21 -5 M5 3 Q13 5 22 3 M6 11 Q13 12 19 11" fill="none"/>
    </g>
  </g>
</svg>
