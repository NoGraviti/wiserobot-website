<svg viewBox="0 0 560 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WiseRobot mascot waving, surrounded by email, calendar, tick and hours-saved icons">
  <style>
    .wave { transform-origin: 326px 352px; animation: wave 2.4s ease-in-out infinite; }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
    .bob { animation: bob 3.6s ease-in-out infinite; }
    .bob2 { animation: bob 4.4s ease-in-out infinite reverse; }
    .ball { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes wave { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-18deg); } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.25); } }
    @media (prefers-reduced-motion: reduce) { .wave,.blink,.bob,.bob2,.ball { animation: none; } }
  </style>

  <!-- soft backdrop -->
  <circle cx="280" cy="236" r="208" fill="#0f766e" fill-opacity="0.08"/>
  <circle cx="280" cy="236" r="150" fill="#94a3b8" fill-opacity="0.12"/>

  <!-- floating icon cards (grey outline, teal glyphs) -->
  <g class="bob">
    <g transform="translate(40,84)">
      <rect width="78" height="62" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="18" y="19" width="42" height="28" rx="6" fill="#f1f5f9" stroke="#0f766e" stroke-width="2.5"/>
      <path d="M20 23l19 14 19-14" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <g class="bob2">
    <g transform="translate(450,70)">
      <rect width="78" height="70" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="16" y="20" width="46" height="36" rx="7" fill="#f1f5f9" stroke="#0f766e" stroke-width="2.5"/>
      <rect x="16" y="20" width="46" height="10" rx="5" fill="#0f766e"/>
      <circle cx="29" cy="42" r="3.5" fill="#0f766e"/><circle cx="39" cy="42" r="3.5" fill="#0f766e"/><circle cx="49" cy="42" r="3.5" fill="#94a3b8"/>
    </g>
  </g>
  <g class="bob">
    <g transform="translate(452,330)">
      <circle cx="34" cy="34" r="34" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="34" cy="34" r="22" fill="#0f766e"/>
      <path d="M24 35l7 7 13-15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <g class="bob2">
    <g transform="translate(30,310)">
      <rect width="96" height="58" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="26" cy="29" r="14" fill="#94a3b8"/>
      <path d="M26 21v9l6 4" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="36" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="800" font-size="20" fill="#134e4a">+5h</text>
    </g>
  </g>

  <!-- ground shadow -->
  <ellipse cx="280" cy="430" rx="84" ry="10" fill="#64748b" fill-opacity="0.18"/>

  <!-- stubby legs and feet -->
  <rect x="246" y="398" width="26" height="22" rx="10" fill="#475569"/>
  <rect x="288" y="398" width="26" height="22" rx="10" fill="#475569"/>
  <ellipse cx="256" cy="420" rx="23" ry="10" fill="#64748b"/>
  <ellipse cx="304" cy="420" rx="23" ry="10" fill="#64748b"/>

  <!-- left arm (resting, stubby) -->
  <path d="M236 352 Q214 362 210 384" fill="none" stroke="#0f9488" stroke-width="19" stroke-linecap="round"/>
  <circle cx="209" cy="388" r="12" fill="#99d5cf"/>

  <!-- neck and small pear-shaped body -->
  <rect x="262" y="322" width="36" height="22" rx="8" fill="#134e4a"/>
  <path d="M280 330 C318 330 336 352 334 380 C332 404 312 414 280 414 C248 414 228 404 226 380 C224 352 242 330 280 330 Z" fill="#0f766e"/>
  <!-- belly highlight -->
  <path d="M244 356 Q252 342 268 340" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="6" stroke-linecap="round"/>
  <!-- chest panel -->
  <rect x="252" y="354" width="56" height="38" rx="14" fill="#f1f5f9"/>
  <path d="M268 373l8 8 15-16" fill="none" stroke="#0f766e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- antenna: tapered stem + ball -->
  <path d="M271 96 L289 96 L285 62 L275 62 Z" fill="#134e4a"/>
  <circle class="ball" cx="280" cy="52" r="13" fill="#ff7a59"/>

  <!-- ears (slanted side pods, like the logo) -->
  <path d="M130 192 L116 197 Q103 201 102 216 L100 262 Q100 276 112 276 L130 268 Z" fill="#134e4a"/>
  <path d="M430 192 L444 197 Q457 201 458 216 L460 262 Q460 276 448 276 L430 268 Z" fill="#134e4a"/>

  <!-- raised top bump -->
  <path d="M232 128 Q232 100 262 98 L298 98 Q328 100 328 128 Z" fill="#134e4a"/>

  <!-- head: thick dark ring, wide and squat -->
  <path d="M130 230 C130 148 196 112 280 112 C364 112 430 148 430 230 C430 300 372 338 280 338 C188 338 130 300 130 230 Z" fill="#134e4a"/>
  <!-- light face -->
  <path d="M164 232 C164 178 212 146 280 146 C348 146 396 178 396 232 C396 276 350 304 280 304 C210 304 164 276 164 232 Z" fill="#f1f5f9"/>

  <!-- eyes: tall ovals -->
  <ellipse class="blink" cx="232" cy="226" rx="17" ry="25" fill="#134e4a"/>
  <ellipse class="blink" cx="328" cy="226" rx="17" ry="25" fill="#134e4a"/>
  <!-- waving right arm (drawn last so it stays in front of the head) -->
  <g class="wave">
    <path d="M326 352 Q356 358 374 336" fill="none" stroke="#0f9488" stroke-width="19" stroke-linecap="round"/>
    <circle cx="378" cy="328" r="12" fill="#99d5cf"/>
  </g>
</svg>
